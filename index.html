  const head=leadId?C('profiles').find(p=>p.id===leadId):(C('profiles').find(p=>p.id===cl?.head_coach_id)||C('profiles').find(p=>p.role==='head'&&p.active));
  const others=teamIds.filter(id=>id!==leadId).map(id=>{const p=C('profiles').find(x=>x.id===id);return p?p.name:'';}).filter(Boolean);
  const assistants=teamIds.length?(others.join('、')||'—'):'（未指派，教練任務步驟可設）';
  const hour=new Date().getHours(),hi=hour<11?'早安':hour<18?'午安':'晚安';
  /* 直接帶到「下一個沒完成的步驟」，教練不用自己從第1步一路點過去 */
  const nextStep=PLAN_STEP_DEFS.filter(s=>s[0]!=='report').find(s=>!(ps.done||{})[s[0]]);
  let cta=ps.dp
    ?{label:nextStep?`繼續備課：${nextStep[1]}（第 ${PLAN_STEP_KEYS.indexOf(nextStep[0])+1} 步）`:'今日備課已完成',view:nextStep?nextStep[0]:'publish',area:'plan'}
    :{label:'⚡ 快速備課（一鍵生成整堂）',view:'quickplan',area:'plan'};
  if(ps.dp&&ps.dp.status==='pub')cta={label:'查看今日執行內容',view:'live',area:'today'};
  else if(ps.dp&&['done','lock'].includes(ps.dp.status))cta={label:'完成課後回報',view:'report',area:'today'};
  el.innerHTML=`
  <div style="margin-bottom:14px"><div style="font-size:13px;color:var(--sub)">${hi}，${esc(State.user.name)}</div>
    <div style="font-size:20px;font-weight:800">${esc(s.dojo)}</div></div>
  <div class="ctxrow" style="margin-bottom:14px">
    <div class="grow" style="min-width:150px"><label class="sm">班別</label><select id="hClass" aria-label="選擇班別">${cls.map(c=>`<option value="${c.id}" ${c.id===State.ctx.classId?'selected':''}>${esc(c.name)}</option>`).join('')||'<option>（尚無班別）</option>'}</select></div>
    <div class="grow" style="min-width:150px"><label class="sm">日期</label><input type="date" id="hDate" value="${State.ctx.date}" aria-label="選擇日期"></div>
  </div>
  <div class="course-card">
    <div class="cc-top">
      <div class="info"><h2>${cl?esc(cl.name):'（未選班別）'}</h2><p>${WEEKDAYS[wd]}・${State.ctx.date}${cl?'・'+cl.start_time+'–'+cl.end_time:''}</p></div>
      <div class="ring-big" style="--p:${ps.pct}"><i>${ps.pct}%</i></div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="n">${ps.list.length}</div><div class="l">預計人數</div></div>
      <div class="metric"><div class="n">${suggN}</div><div class="l">分組數</div></div>
      <div class="metric"><div class="n">${coaches}</div><div class="l">可出席教練</div></div>
      <div class="metric"><div class="n" style="font-size:15px;padding-top:5px">${exceptionCount}</div><div class="l">未處理異常</div></div>
    </div>
    <div class="grid g2" style="margin-top:8px">
      <div class="kv"><b>主教練</b><span>${esc(head?.name||'—')}</span></div><div class="kv"><b>助教</b><span>${esc(assistants)}</span></div>

      <div class="kv"><b>最近備份</b><span>${latestBackup?new Date(latestBackup.created_at).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}</span></div><div class="kv"><b>狀態</b><span>${statusAction(ps.dp?ps.dp.status:'draft')}</span></div>
    </div>
    <button class="btn block lg" style="margin-top:12px" onclick="App.go('${cta.view}','${cta.area}')">${cta.label}</button>

      ${ps.dp&&ps.dp.status==='pub'?`<button class="btn ok grow" onclick="App.go('live','today')">開始上課</button>`:`<button class="btn secondary grow" onclick="App.go('groups','plan')">查看分組</button>`}

  ${roleDashboard()}
  <div class="sect-head"><h3>今日待完成事項</h3><span class="sp"></span><span class="muted">${todos.length} 項</span></div>
  <div>${todos.length?todos.map(t=>`<button class="todo ${t.level}" onclick="App.go('${t.view}')">

  <div class="card" id="homeDisc"></div>`;
  $('#hClass')&&($('#hClass').onchange=e=>{State.ctx.classId=e.target.value;App.go('home','today');});

/* §七 依角色的首頁總覽（管理者 / 主教練）；助教走「我的任務」 */
function roleDashboard(){
  const r=State.user.role,td=todayStr(),wkStart=mondayOf(td),wkEnd=addDays(wkStart,6);
  const wp=C('daily_plans').filter(d=>d.date>=wkStart&&d.date<=wkEnd);
  const noReport=d=>['pub','done','lock'].includes(d.status)&&d.date<=td&&!C('post_class_reports').some(pr=>pr.daily_plan_id===d.id);
  const row=(level,title,count,sub,onclick)=>`<button class="todo ${level}" onclick="${onclick}"><span class="tc" style="color:var(--color-${level==='block'?'danger':level==='warn'?'warning':level==='bad'?'danger':level==='ok'?'success':'info'})">${svg(count?'alert':'check',20)}</span><span class="body"><span class="t">${title}${count?'（'+count+'）':''}</span><span class="s">${sub}</span></span><span class="tc" style="color:var(--color-text-disabled)">${svg('chevron',18)}</span></button>`;
  if(r==='admin'){
    const draftN=wp.filter(d=>['draft','disc'].includes(d.status)).length;

const PLAN_STEP_DEFS=[
  ['classinfo','課程',svg('school',16)],
  ['stats','人數',svg('chart',16)],
  ['groups','分組',svg('layers',16)],
  ['plan','內容',svg('clipboard',16)],
  ['coachtasks','教練',svg('users',16)],
  ['publish','發布',svg('check',16)],
  ['report','課後',svg('edit',16)],
];
const PLAN_STEP_KEYS=PLAN_STEP_DEFS.map(s=>s[0]);
function planStepMeta(view){return PLAN_STEP_DEFS.map((s,i)=>({key:s[0],label:s[1],icon:s[2],num:i+1,on:s[0]===view}));}
function planStepDone(ps){
  const dp=ps.dp;
  const date=ps.date||(dp?dp.date:State.ctx.date),classId=ps.classId||(dp?dp.class_id:State.ctx.classId);
  return {
    classinfo:!!dp,
    stats:ps.steps.stats&&Stats.attendanceConfirmed(date,classId),
    groups:ps.steps.groups,
    /* 第 5 步「教練」＝每組都有教練 ＋ 已指定當日主責教練（教練確認為此步驟內的選配動作） */
    coachtasks:ps.groups.length>0&&!ps.val.issues.some(i=>i.t==='nocoach')&&!!(dp&&dp.lead_coach_id),
    plan:ps.steps.plan,
    publish:ps.steps.publish,
    report:!!(dp&&C('post_class_reports').some(pr=>pr.daily_plan_id===dp.id)),
  };
}
function decoratePlan(view){
  const el=$('#view'); if(!el)return;
  const ps=planStatus(State.ctx.date,State.ctx.classId);
  const done=ps.done||planStepDone(ps);
  /* 教練確認併入第 5 步「教練」，在確認頁時仍要高亮該步驟，不能讓步驟條沒有任何一格亮著 */
  const steps=planStepMeta(view==='confirm'?'coachtasks':view);
  const idx=Math.max(0,steps.findIndex(s=>s.on));
  const desktop=`<div class="stepper">${steps.map(s=>`<button class="stp ${s.on?'on':done[s.key]?'done':''}" onclick="App.go('${s.key}','plan')"><span class="num">${done[s.key]?svg('check',14):s.num}</span><span class="lbl">${s.label}</span></button>`).join('')}</div>`;
  const mobile=`<div class="stepper-m"><div class="ring" style="--p:${ps.pct}"><i>${ps.pct}%</i></div><div class="now"><b>${steps[idx].label}</b><br><span>步驟 ${idx+1}/${steps.length}・${State.ctx.date}</span></div><span class="sp"></span><button class="iconbtn" onclick="App.go('home','today')" title="回今日">${svg('home',20)}</button></div>`;
  el.insertAdjacentHTML('afterbegin',desktop+mobile);
}
function stageFilled(blocks,key){
  const b=blocks.find(x=>x.block_type===key&&!x.training_group_id); if(!b)return false;
  if(key==='review')return !!(b.praise||b.remind||b.homework||b.preview);
  if(key==='fitness')return !!((b.content&&String(b.content).trim())||(b.warmups&&b.warmups.length));
  return !!(b.content&&String(b.content).trim());
}
function publishIssues(dp){
  if(!dp)return ['尚未建立今日備課'];
  const ps=planStatus(dp.date,dp.class_id);
  const out=[];
  if(!ps.groups.length)out.push('尚未完成分組');
  ps.val.issues.forEach(i=>out.push(i.msg));
  ['warmup','fitness','apply','review'].forEach(k=>{if(!stageFilled(ps.blocks,k))out.push((BLOCKS.find(b=>b.key===k)?.name||k)+'尚未填寫');});
  if(!ps.blocks.some(b=>b.block_type==='group'&&(b.basic||b.kick||b.goal)))out.push('分組訓練內容尚未填寫');
  return out;
}

Views.pptApplyData=async function(L){
  if(!State.ctx.classId){toast('請先選擇今日班別','warn');return;}
  let dp=findDaily(State.ctx.date,State.ctx.classId);
  if(!dp)dp=await ensureDaily(State.ctx.date,State.ctx.classId);
  await save('daily_plans',{...dp,pptLessonId:L.id,pptLessonTitle:L.title,pptLessonFile:L.file});
  dp=findDaily(State.ctx.date,State.ctx.classId)||dp;
  const tl=timelineOfPlan(dp);
  const put=async(key,fields)=>{
    const t=tl.find(x=>x.key===key);if(!t)return;
    const cur=C('lesson_blocks').find(x=>x.daily_plan_id===dp.id&&x.block_type===key&&!x.training_group_id)
      ||{id:uid('lb'),daily_plan_id:dp.id,training_group_id:null,block_type:key,start_minute:t.s,end_minute:t.e,done:false};
    await save('lesson_blocks',{...cur,...fields});
  };
  const checks=L.checks.join('／');
  await put('warmup',{content:`集合、敬禮、點名；完整示範一次今日主題：${L.focus}\n主題式暖身服務主課，安全先講清楚。`,goal:'收心、建立今日核心目標',equipment:'碼表、地面標記',safety_notes:'踢擊線與回程線分開；持靶者站穩再喊開始；先演練停止口令。'});
  await put('fitness',{content:`${L.fit}\n遊戲：${L.game}`,goal:`為主課建立身體能力：${L.fit}`,tags:['平衡','協調','專項暖身'].filter(Boolean),formation:'棋盤式',formationOther:''});
  await put('apply',{content:`${L.challenge}\n【今日驗收】每人依三個檢查點檢核：${checks}。10次中至少8次達標列為通過；未達標列入補強或退階名單。`,goal:'把主技術帶進應用並完成當堂驗收',equipment:'踢靶、地面標記、碼表',applyType:L.challenge.includes('闖關')?'闖關':L.challenge.includes('測驗')?'模擬比賽':'挑戰',safety_notes:`常見處理：看到動作品質下降就降速或退階。檢查點：${checks}`});
  await put('review',{remind:`學生能說出今日三重點：${checks}`,preview:L.next,note:'課後紀錄請填：通過／需加強／尚未掌握名單、最多人做錯項目、下堂修改。'});
  const groups=C('training_groups').filter(g=>g.daily_plan_id===dp.id);
  for(const g of groups){
    const t=tl.find(x=>x.key==='group');
    const cur=C('lesson_blocks').find(x=>x.daily_plan_id===dp.id&&x.block_type==='group'&&x.training_group_id===g.id)
      ||{id:uid('lb'),daily_plan_id:dp.id,training_group_id:g.id,block_type:'group',start_minute:t.s,end_minute:t.e,done:false};
    await save('lesson_blocks',{...cur,basic:L.title,kick:L.focus,poomsae:'',goal:`${L.focus}；檢查點：${checks}`,commonErr:'依PPT常見錯誤表現場退階修正',equipment:'踢靶、地面標記、碼表',
      skillA:'退回分解、扶牆或低速；只要求第一個檢查點先穩定。',skillB:`完成本堂標準：${checks}，10次中8次達標。`,skillC:'加入移動、反應、左右腳或情境，但不能犧牲收腿與落地。'});
  }
  await audit('ppt_apply','daily_plans',dp.id,null,{lesson:L.id,title:L.title});
  Modal.close();
  toast(`已套用 ${L.title}${groups.length?'（含 '+groups.length+' 組分級內容）':'（尚未分組，分組後可再套用一次）'}`,'ok');
  App.go('plan','plan');
};

/* 今日教練團（逐日指派，最多 MAX_COACHES_PER_CLASS 位；dp.team 為 4 格陣列，team[0]=主責）*/
function teamSlots(dp){
  if(dp.team&&dp.team.length){const t=dp.team.slice(0,4);while(t.length<4)t.push('');return t;}
  const derived=[...new Set([dp.lead_coach_id,...(dp.assigned_coach_ids||[])].filter(Boolean))].slice(0,4);
  while(derived.length<4)derived.push('');return derived;
}
function teamCoaches(dp){return teamSlots(dp).filter(Boolean);}
Views.setTeamSlot=async function(dpId,slot,coachId){
  const dp=C('daily_plans').find(d=>d.id===dpId);let t=teamSlots(dp);
  if(coachId)t=t.map((id,i)=>i!==slot&&id===coachId?'':id); // 同一人不重複佔兩格
  t[slot]=coachId;
  const assigned=[...new Set(t.filter(Boolean))];
  if(assigned.length>MAX_COACHES_PER_CLASS)toast('每堂課最多 '+MAX_COACHES_PER_CLASS+' 位教練','warn');
  dp.team=t;dp.assigned_coach_ids=assigned;dp.lead_coach_id=t[0]||assigned[0]||'';
  await save('daily_plans',dp);App.go('coachtasks','plan');
};

    <div class="kv"><b>注意</b><span>${esc(gb.commonErr||gb.safety_notes||'—')}</span></div>

/* 教練確認卡：教練分工頁（第5步）與教練確認頁共用同一份，避免兩邊行為不一致 */
function ctConfirmCard(dp){
  const groups=C('training_groups').filter(g=>g.daily_plan_id===dp.id);
  const ids=[...new Set([...groups.flatMap(g=>[g.coach_id,g.assistant_id]),...teamCoaches(dp)].filter(Boolean))];
  const confirms=dp.confirms||[];
  const doneN=ids.filter(id=>confirms.some(c=>c.user_id===id)).length;
  const mine=confirms.some(c=>c.user_id===State.user.id);
  return `<div class="card"><div class="sect-head" style="margin-top:0"><h3>教練確認</h3><span class="sp" style="flex:1"></span><span class="tag ${doneN&&doneN===ids.length?'spec':''}">${doneN}/${ids.length||0} 已確認</span></div>
    <p class="muted">選配項目：確認後會記錄在此課程，發布前可檢查誰還沒看過課表。未全部確認也可以發布。</p>
    ${ids.length?ids.map(id=>{const p=C('profiles').find(x=>x.id===id);const on=confirms.some(c=>c.user_id===id);
      return `<div class="confirm-coach"><div class="av">${esc(initials(p?.name||''))}</div><div class="grow"><b>${esc(p?.name||id)}</b><br><span class="muted">${on?'已確認':'尚未確認'}</span></div>${on?svg('check',20):''}</div>`;}).join(''):'<div class="empty">尚未指派教練，請先完成分組。</div>'}
    <button class="btn block ${mine?'secondary':''}" ${mine?'disabled':''} onclick="Views.confirmPlan('${dp.id}')">${svg('check',18)} ${mine?'你已確認':'我已確認'}</button>
  </div>`;
}
Views.confirmPlan=async function(dpId){
  const dp=C('daily_plans').find(d=>d.id===dpId); dp.confirms=dp.confirms||[];
  if(!dp.confirms.some(c=>c.user_id===State.user.id))dp.confirms.push({user_id:State.user.id,name:State.user.name,at:Date.now()});
  if(dp.status==='draft')dp.status='wait';
  await save('daily_plans',dp); toast('已確認','ok'); App.go(App.view==='confirm'?'confirm':'coachtasks','plan');
};

Views.publishFromFlow=async function(dpId,hasIssues){

/* ---------- 上課模式（大字大鈕；只顯示現場需要的，不含任何管理功能 §四） ---------- */
Views.view_live=function(el){
  ensureClassCtx();
  const dp=findDaily(State.ctx.date,State.ctx.classId);
  if(!dp){el.innerHTML='<div class="empty">尚未建立今日課程，無法進入現場模式。<br><br><button class="btn" onclick="App.go(\'classinfo\',\'plan\')">前往備課</button></div>';return;}
  const cl=C('classes').find(c=>c.id===State.ctx.classId);
  const blocks=C('lesson_blocks').filter(b=>b.daily_plan_id===dp.id);
  const groups=C('training_groups').filter(g=>g.daily_plan_id===dp.id);
  const LTL=timelineFor(State.ctx.classId);
  if(App._liveIdx==null){App._liveIdx=0;App._liveStart=Date.now();App._liveDur=(LTL[0].e-LTL[0].s)*60;}
  const idx=App._liveIdx,bl=LTL[idx];
  const sb=blocks.find(b=>b.block_type===bl.key&&!b.training_group_id)||{};
  const coach=id=>{const p=C('profiles').find(x=>x.id===id);return p?p.name:'—';};
  const focus=bl.key==='group'
    ? (groups.length?groups.map(g=>{const gb=blocks.find(x=>x.block_type==='group'&&x.training_group_id===g.id)||{};return `<div class="kv"><b>${esc(g.name)}（${esc(coach(g.coach_id))}）</b><span>${esc([gb.basic,gb.kick].filter(Boolean).join('・')||g.target||'—')}</span></div>`
        +(hasSplit(g)?SKILL_KEYS.filter(k=>skillRoster(g,k).length).map(k=>`<div class="kv"><b>　${SKILL_ICON[k]}${SKILL_LABEL[k]}</b><span>${esc(skillNames(g,k).join('、'))}${gb['skill'+k]?'：'+esc(gb['skill'+k]):''}</span></div>`).join(''):'');}).join(''):'<div class="muted">尚未分組</div>')
    : `<div class="kv"><b>內容</b><span>${esc(sb.content||[sb.praise,sb.remind].filter(Boolean).join('；')||'—')}</span></div>`;
  el.innerHTML=`
  <div class="live"><div class="nxt">第 ${idx+1}/5 階段・${cl?esc(cl.name):''}</div>
    <div class="stage">${bl.s}–${bl.e}′　${esc(bl.name)}</div>
    <div class="clock" id="liveClock" aria-live="polite">--:--</div>
    <div class="nxt">${idx<4?'下一段：'+LTL[idx+1].name:'最後一段'}　｜　負責：${esc(coach(sb.responsible_coach_id))}</div></div>
  <div class="card" style="margin-top:12px"><div class="sect-head" style="margin-top:0"><h3>本階段重點</h3></div>
    ${focus}${formationText(sb)?`<div class="kv"><b>隊形</b><span>${esc(formationText(sb))}</span></div>`:''}<div class="kv"><b>器材</b><span>${esc(sb.equipment||'—')}</span></div>
    <div class="kv"><b>安全提醒</b><span>${esc(sb.safety_notes||'—')}</span></div></div>
  <div class="live-btns">
    <button class="btn ok" onclick="Views.liveDone()">完成本階段</button>
    <button class="btn" onclick="Views.liveStep(1)">提前下一階段</button>
    <button class="btn secondary" onclick="Views.liveExtend(1)">延長 1 分鐘</button>
    <button class="btn secondary" onclick="Views.liveExtend(5)">延長 5 分鐘</button>
    <button class="btn secondary" onclick="Views.liveStep(-1)">上一階段</button>
    <button class="btn secondary" onclick="Views.liveGroups()">查看分組</button>
  </div>
  <button class="btn danger block" style="margin-top:10px" onclick="Views.liveNote('${dp.id}','傷勢')">發生傷勢 / 安全事件</button>
  <button class="btn secondary block" style="margin-top:6px" onclick="Views.liveNote('${dp.id}','')">臨時紀錄現場狀況</button>
  <button class="btn ghost block" style="margin-top:6px" onclick="App.go('report','plan')">結束上課 → 課後紀錄</button>`;
  App._liveDur=App._liveDur||(bl.e-bl.s)*60;
  const tick=()=>{const cE=document.getElementById('liveClock');if(!cE){clearInterval(App._liveTimer);return;}
    let left=App._liveDur-Math.floor((Date.now()-App._liveStart)/1000),over=false;if(left<0){over=true;left=-left;}
    cE.textContent=(over?'+':'')+String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
    cE.style.color=over?'var(--color-accent-500)':'';};
  tick();App._liveTimer=setInterval(tick,1000);
};
Views.liveStep=function(d){App._liveIdx=Math.max(0,Math.min(4,(App._liveIdx||0)+d));App._liveStart=Date.now();const t=timelineFor(State.ctx.classId)[App._liveIdx];App._liveDur=(t.e-t.s)*60;App.go('live','today');};
Views.liveExtend=function(min){App._liveDur=(App._liveDur||0)+min*60;toast('本階段延長 '+min+' 分鐘','ok');};
Views.liveDone=async function(){const dp=findDaily(State.ctx.date,State.ctx.classId);const bl=timelineFor(State.ctx.classId)[App._liveIdx||0];if(dp&&bl.key!=='group')await Views.saveBlockField(dp.id,bl.key,null,'done',true);toast('已完成本階段','ok');Views.liveStep(1);};
Views.liveGroups=function(){const dp=findDaily(State.ctx.date,State.ctx.classId);const groups=dp?C('training_groups').filter(g=>g.daily_plan_id===dp.id):[];const stName=id=>{const s=C('students').find(x=>x.id===id);return s?esc(s.name):'';};const coach=id=>{const p=C('profiles').find(x=>x.id===id);return p?esc(p.name):'—';};Modal.open('今日分組',groups.length?groups.map(g=>`<div class="card" style="margin-bottom:8px;box-shadow:none"><b>${esc(g.name)}（${coach(g.coach_id)}）</b><div class="muted" style="margin-top:4px">${(g.students||[]).map(stName).join('、')||'—'}</div></div>`).join(''):'<div class="empty">尚未分組</div>');};
Views.liveNote=function(dpId,kind){Modal.open(kind==='傷勢'?'紀錄傷勢 / 安全事件':'紀錄現場狀況',`${kind!=='傷勢'?`<div class="chips" style="margin-bottom:10px">${['人數異動','器材問題','課程延遲','學員不適','臨時調整'].map(t=>`<span class="chip" onclick="var i=document.getElementById('lnMsg');i.value=(i.value?i.value+'；':'')+'${t}'">${t}</span>`).join('')}</div>`:''}<textarea id="lnMsg" placeholder="描述…" aria-label="現場狀況"></textarea><button class="btn ${kind==='傷勢'?'danger':''} block" style="margin-top:8px" onclick="Views.saveLiveNote('${dpId}','${kind}')">送出</button>`);};
Views.saveLiveNote=async function(dpId,kind){const msg=$('#lnMsg').value.trim();if(!msg){toast('請輸入內容','warn');return;}await save('discussions',{id:uid('ds'),daily_plan_id:dpId,author_id:State.user.id,author_name:State.user.name+'（現場）',message:(kind==='傷勢'?'【傷勢/安全】':'【現場】')+msg,parent_id:null,created_at:Date.now(),reads:[State.user.id]});Modal.close();toast(kind==='傷勢'?'已紀錄傷勢事件':'現場狀況已紀錄','ok');};

/* ---------- STUDENTS ---------- */
Views.view_students=function(el){
  Views._studentSelected=Views._studentSelected||new Set();
  el.innerHTML=`
  <div class="card">
    <div class="row">
      <input class="grow" id="stuSearch" placeholder="🔍 搜尋姓名/備註">
      ${can('*')?'<button class="btn sm" onclick="Views.editStudent()">＋ 新增</button>':''}
      ${can('*')&&C('students').some(s=>s.demo===true)?'<button class="btn bad sm" onclick="App.deleteDemoStudents()">刪除示範學員</button>':''}
    </div>
    <div class="row" style="margin-top:8px">
      <select id="fAge"><option value="">全部年齡</option>${AGE_GROUPS.map(a=>`<option>${a}</option>`).join('')}</select>
      <select id="fBelt"><option value="">全部級別</option>${BELTS.map(b=>`<option>${b}</option>`).join('')}</select>
      <select id="fSpec"><option value="">全部專項</option>${SPECIALTIES.map(s=>`<option>${s}</option>`).join('')}</select>
      <select id="fClass"><option value="">全部班別</option>${C('classes').map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      <select id="fWd"><option value="">全部上課日</option>${WEEKDAYS.map((w,i)=>`<option value="${i}">${w}</option>`).join('')}</select>
    </div>
  </div>
  <div id="stuList"></div>`;
  const render=()=>{
    const q=$('#stuSearch').value.trim(), fa=$('#fAge').value,fb=$('#fBelt').value,fs=$('#fSpec').value,fc=$('#fClass').value,fw=$('#fWd').value;
    let list=C('students').filter(s=>s.active);
    if(q)list=list.filter(s=>(s.name+s.notes).includes(q));
    if(fa)list=list.filter(s=>s.age_group===fa);
    if(fb)list=list.filter(s=>normBelt(s.belt_rank)===fb);
    if(fs)list=list.filter(s=>s.specialty===fs);
    if(fc)list=list.filter(s=>s.class_id===fc);
    if(fw!=='')list=list.filter(s=>(s.weekdays||[]).includes(WEEKDAYS[+fw]));
    const selected=[...Views._studentSelected].filter(id=>C('students').some(s=>s.id===id&&s.active));
    Views._studentSelected=new Set(selected);
    $('#stuList').innerHTML=list.length?`<div class="card" style="margin-top:12px">
      ${can('*')?`<div class="row" style="margin-bottom:8px"><button class="btn xs g" onclick="Views.selectVisibleStudents()">全選目前篩選 ${list.length} 人</button><button class="btn xs g" onclick="Views.clearStudentSelection()">清除選取</button><button class="btn xs ${selected.length?'':'disabled'}" onclick="Views.bulkSetClass()">設定班別 ${selected.length} 人</button><button id="bulkDelBtn" class="btn xs bad ${selected.length?'':'disabled'}" onclick="Views.deleteSelectedStudents()">刪除選取 ${selected.length} 人</button></div>`:''}
      <div class="scroll"><table class="tbl">
      <tr>${can('*')?'<th style="width:34px">選</th>':''}<th>姓名</th><th>年齡</th><th>級別</th><th>專項</th><th>班別</th><th>進度</th><th>上課日</th><th></th></tr>
      ${list.map(s=>`<tr>
        ${can('*')?`<td><input type="checkbox" class="stuChk" data-id="${s.id}" ${Views._studentSelected.has(s.id)?'checked':''} onchange="Views.toggleStudentSelection('${s.id}',this.checked)"></td>`:''}
        <td><b>${esc(s.name)}</b>${s.promotion_status?' 🎯':''}${s.competition_athlete?' 🏅':''}</td>
        <td><span class="tag age">${s.age_group}</span></td>
        <td style="white-space:nowrap">${beltDot(s.belt_rank)}<span style="font-size:12px">${normBelt(s.belt_rank)}</span></td>
        <td><span class="tag spec">${s.specialty}</span></td>
        <td class="muted">${s.class_id&&C('classes').find(x=>x.id===s.class_id)?esc(C('classes').find(x=>x.id===s.class_id).name):'<span style="color:var(--color-danger)">未設定</span>'}</td>
        <td class="muted" style="font-size:11px">${[s.current_progress&&('品勢:'+esc(s.current_progress)),s.tech&&('技術:'+esc(s.tech))].filter(Boolean).join('<br>')||'—'}</td>
        <td class="muted">${(s.weekdays||[]).map(w=>WD_SHORT[WEEKDAYS.indexOf(w)]).join('')||'—'}</td>
        <td>${can('*')?`<button class="btn xs g" onclick="Views.editStudent('${s.id}')">編輯</button>`:''}</td>
      </tr>`).join('')}
    </table></div><div class="muted" style="margin-top:8px">共 ${list.length} 人${can('*')?`・已選 ${selected.length} 人`:''}</div></div>`:'<div class="empty"><div class="ic">👥</div>沒有符合的學員</div>';
    Views._studentVisibleIds=list.map(s=>s.id);
  };
  ['stuSearch','fAge','fBelt','fSpec','fClass','fWd'].forEach(id=>{const e=$('#'+id);e.oninput=render;e.onchange=render;});
  render();
};
Views.toggleStudentSelection=function(id,on){Views._studentSelected=Views._studentSelected||new Set();if(on)Views._studentSelected.add(id);else Views._studentSelected.delete(id);const btn=$('#bulkDelBtn');if(btn){const n=Views._studentSelected.size;btn.textContent='刪除選取 '+n+' 人';btn.classList.toggle('disabled',!n);}};
Views.selectVisibleStudents=function(){Views._studentSelected=Views._studentSelected||new Set();(Views._studentVisibleIds||[]).forEach(id=>Views._studentSelected.add(id));Views.view_students($('#view'));};

Views.deleteSelectedStudents=async function(){const ids=[...(Views._studentSelected||new Set())];if(!ids.length){toast('請先勾選學員','warn');return;}await App.deleteStudentsByIds(ids,{actionName:'批量刪除學員',confirmText:'確認刪除',backupReason:'批量刪除學員前自動備份',auditAction:'delete_students_bulk'});Views._studentSelected=new Set();};

<script>
/* ---------- IMPORT (Excel) ---------- */
Views.view_import=function(el){
  el.innerHTML=`
  <div class="card">
    <h3>📥 Excel / CSV 學員匯入</h3>
    <p class="muted">必要欄位：姓名、年齡層、級別段位、專項、固定上課日、班別。選填：品勢進度、技術動作、備註、是否準備晉級、是否為比賽選手、狀態。</p>
    <div class="row" style="margin-top:8px">
      <button class="btn g sm" onclick="Views.dlTemplate()">⬇️ 下載 Excel 範本</button>
      <label class="btn sm">📁 選擇檔案<input type="file" id="impFile" accept=".xlsx,.xls,.csv" style="display:none"></label>
    </div>
  </div>
  <div id="impPreview"></div>`;
  $('#impFile').onchange=Views.parseImport;
};
Views.dlTemplate=function(){
  const rows=[['姓名','年齡層','級別段位','專項','固定上課日','班別','品勢進度','技術動作','備註','是否準備晉級','是否為比賽選手','狀態'],
    ['王小明','國小','黃帶','基礎','一、二、三、四、五','健身班','太極一章','前踢、旋踢','認真','否','否','啟用'],
    ['陳大華','國中','藍帶','比賽選手','一、二、三、四、五','選手班','太極三章','橫踢、後踢','','是','是','啟用'],
    ['林阿成','幼兒','白帶','基礎','六','週六健身班','','基本站姿、前踢','需家長陪同','否','否','啟用']];
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'學員名單');
  XLSX.writeFile(wb,'學員名單範本.xlsx');
  toast('範本已下載','ok');
};
Views._imp=null;
Views.parseImport=function(e){
  const f=e.target.files[0]; if(!f)return;
  const reader=new FileReader();
  $('#impPreview').innerHTML='<div class="loading"><div class="spin"></div>解析中…</div>';
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      Views.validateImport(rows);
    }catch(err){$('#impPreview').innerHTML=`<div class="warnbox">解析失敗：${esc(err.message)}</div>`;}
  };
  reader.readAsBinaryString(f);
};
Views.validateImport=function(rows){
  if(!rows.length){$('#impPreview').innerHTML='<div class="warnbox">檔案為空</div>';return;}
  const header=rows[0].map(h=>String(h).trim());
  const idx=n=>header.findIndex(h=>h.includes(n));
  const ci={name:idx('姓名'),age:idx('年齡'),belt:idx('級別'),spec:idx('專項'),wd:idx('上課日'),cls:idx('班別'),
    prog:idx('進度'),tech:idx('技術'),note:idx('備註'),promo:idx('晉級'),comp:idx('比賽'),st:idx('狀態')};
  if(ci.name<0){$('#impPreview').innerHTML='<div class="warnbox">找不到「姓名」欄位，請使用範本格式。</div>';return;}
  const classes=C('classes');
  const existing=C('students');
  const parsed=[]; let nNew=0,nUpd=0,nDup=0,nErr=0;
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; if(r.every(c=>String(c).trim()===''))continue;
    const errs=[]; const g=k=>ci[k]>=0?String(r[ci[k]]).trim():'';
    const name=g('name');
    let age=g('age'),belt=normBelt(g('belt')),spec=g('spec')||'尚未分類',wdRaw=g('wd'),clsName=g('cls');
    if(!name)errs.push('姓名空白');
    if(age&&!ageOK(age))errs.push('年齡層不正確（限幼兒/國小/國中/成人）');
    if(!age)errs.push('年齡層缺漏');
    if(belt&&!beltOK(belt))errs.push('級別段位不存在');
    if(!belt)errs.push('級別段位缺漏');
    if(spec&&!SPECIALTIES.includes(spec))errs.push('無法辨識的專項');
    const wd=normWeekdays(wdRaw);
    if(wdRaw&&!wd.length)errs.push('上課日格式錯誤');
    let clsId='';
    if(clsName){const c=classes.find(c=>c.name===clsName);if(c)clsId=c.id;else errs.push('班別不存在：'+clsName);}
    // 重複（同名同班）
    const dup=existing.find(s=>s.name===name&&s.class_id===clsId&&s.active);
    const obj={id:dup?dup.id:uid('st'),name,age_group:age,belt_rank:belt,specialty:spec,class_id:clsId,
      weekdays:wd,current_progress:g('prog'),tech:g('tech'),notes:g('note'),
      promotion_status:/是|Y|yes|1|✓/i.test(g('promo')),
      competition_athlete:/是|Y|yes|1|✓/i.test(g('comp')),
      active:!/停|停用|0|inactive/i.test(g('st')),demo:false};
    let kind='new';
    if(errs.length){kind='err';nErr++;}
    else if(dup){kind='dup';nDup++;nUpd++;}
    else nNew++;
    parsed.push({row:i+1,obj,errs,kind});
  }
  Views._imp=parsed;
  $('#impPreview').innerHTML=`
  <div class="card">
    <div class="row">
      <div class="stat" style="cursor:default"><div class="n" style="color:var(--ok)">${nNew}</div><div class="l">新增</div></div>
      <div class="stat" style="cursor:default"><div class="n" style="color:var(--brand)">${nUpd}</div><div class="l">更新/重複</div></div>
      <div class="stat" style="cursor:default"><div class="n" style="color:var(--bad)">${nErr}</div><div class="l">錯誤</div></div>
    </div>
    ${nErr?'<div class="warnbox">有 '+nErr+' 筆錯誤資料，這些將不會匯入。請修正 Excel 後重新上傳。</div>':'<div class="okbox">資料檢查通過，可確認匯入。</div>'}
    <div class="scroll" style="max-height:340px;overflow:auto;margin-top:8px"><table class="tbl">
      <tr><th>列</th><th>姓名</th><th>年齡</th><th>級別</th><th>專項</th><th>上課日</th><th>結果</th></tr>
      ${parsed.map(p=>`<tr style="${p.kind==='err'?'background:#fef2f2':''}">
        <td>${p.row}</td><td>${esc(p.obj.name)}</td><td>${esc(p.obj.age_group)}</td><td>${esc(p.obj.belt_rank)}</td>
        <td>${esc(p.obj.specialty)}</td><td class="muted">${(p.obj.weekdays||[]).map(w=>WD_SHORT[WEEKDAYS.indexOf(w)]).join('')}</td>
        <td>${p.kind==='err'?'<span style="color:var(--bad)">'+esc(p.errs.join('；'))+'</span>':p.kind==='dup'?'<span class="tag">更新</span>':'<span class="tag spec">新增</span>'}</td>
      </tr>`).join('')}
    </table></div>
    <button class="btn block ${nErr&&nNew+nUpd===0?'':''}" style="margin-top:10px" onclick="Views.commitImport()">✅ 確認匯入 ${nNew+nUpd} 筆（略過 ${nErr} 筆錯誤）</button>
  </div>`;
};
Views.commitImport=async function(){
  const ok=Views._imp.filter(p=>p.kind!=='err');
  if(!ok.length){toast('沒有可匯入的資料','warn');return;}
  for(const p of ok)await save('students',p.obj);
  await audit('import','students',null,null,{count:ok.length});
  toast('已匯入 '+ok.length+' 筆','ok');
  $('#impPreview').innerHTML='<div class="okbox">✅ 匯入完成，共 '+ok.length+' 筆。</div>';
  Views._imp=null;
};
</script>

Views.editClass=function(id){

Views.saveClass=async function(id){
